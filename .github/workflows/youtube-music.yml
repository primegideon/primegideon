name: YouTube Music Now Playing

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install ytmusicapi requests

      - name: Generate Live Now Playing SVG
        env:
          YOUTUBE_MUSIC_COOKIE: ${{ secrets.YOUTUBE_MUSIC_COOKIE }}
        run: |
          python -c '
          import os, json
          from ytmusicapi import YTMusic

          cookie = os.environ.get("YOUTUBE_MUSIC_COOKIE")
          
          # Create the required JSON structure for ytmusicapi
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "*/*",
              "Accept-Language": "en-US,en;q=0.5",
              "Content-Type": "application/json",
              "X-Goog-AuthUser": "0",
              "x-origin": "https://music.youtube.com",
              "Cookie": cookie
          }
          
          with open("headers.json", "w") as f:
              json.dump(headers, f)

          try:
              yt = YTMusic("headers.json")
              # Fetch history/recently played
              history = yt.get_history()
              if history:
                  track = history[0]
                  title = track.get("title", "Unknown Track")
                  artists = ", ".join([a["name"] for a in track.get("artists", [])])
              else:
                  title = "No recent tracks"
                  artists = "Offline"
          except Exception as e:
              title = "Coding Session"
              artists = "YouTube Music"

          # Build the clean dynamic SVG card
          svg_content = f"""<svg xmlns="http://www.w3.org/2000/svg" width="490" height="90" viewBox="0 0 490 90">
            <style>
              .bg {{ fill: #0d1117; rx: 12px; }}
              .text {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }}
              .title {{ font-size: 14px; font-weight: bold; fill: #58a6ff; }}
              .artist {{ font-size: 12px; fill: #8b949e; }}
              .pulse {{ fill: #238636; }}
            </style>
            <rect width="490" height="90" class="bg"/>
            <circle cx="30" cy="45" r="6" class="pulse"/>
            <text x="55" y="38" class="text title">{title}</text>
            <text x="55" y="60" class="text artist">{artists}</text>
          </svg>"""

          with open("now_playing.svg", "w") as f:
              f.write(svg_content)
          '
      - name: Commit Updated Widget
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚡ Update live YouTube Music track"
          file_pattern: "now_playing.svg"
