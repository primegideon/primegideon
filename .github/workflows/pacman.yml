name: Generate Pacman Contribution Graph

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Transform Pacman Green Dots to Cyberpunk Purple
        run: |
          sed -i 's/#0e4429/#6E3CBC/gI' dist/pacman-contribution-graph-dark.svg
          sed -i 's/#006d32/#8A2BE2/gI' dist/pacman-contribution-graph-dark.svg
          sed -i 's/#26a641/#A855F7/gI' dist/pacman-contribution-graph-dark.svg
          sed -i 's/#39d353/#C084FC/gI' dist/pacman-contribution-graph-dark.svg

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

