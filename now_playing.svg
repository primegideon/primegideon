<svg xmlns="http://www.w3.org/2000/svg" width="490" height="90" viewBox="0 0 490 90">
  <style>
    .bg { fill: #0d1117; rx: 12px; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: bold; fill: #58a6ff; }
    .artist { font-size: 12px; fill: #8b949e; }
    .pulse { fill: #238636; }
  </style>
  <rect width="490" height="90" class="bg"/>
  <circle cx="30" cy="45" r="6" class="pulse"/>
  <text x="55" y="38" class="text title">Coding Session</text>
  <text x="55" y="60" class="text artist">YouTube Music</text>
</svg>