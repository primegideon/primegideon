<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101f" />
      <stop offset="45%" stop-color="#161f3c" />
      <stop offset="100%" stop-color="#2c1746" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5dd4ff" />
      <stop offset="40%" stop-color="#9d94ff" />
      <stop offset="100%" stop-color="#ff85c6" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="revealLine1">
      <rect x="60" y="95" width="0" height="70">
        <animate attributeName="width" from="0" to="1080" dur="3s" begin="0.4s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="revealLine2">
      <rect x="60" y="150" width="0" height="70">
        <animate attributeName="width" from="0" to="930" dur="3s" begin="2.0s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="revealCaret">
      <rect x="60" y="210" width="0" height="70">
        <animate attributeName="width" from="0" to="980" dur="3s" begin="2.0s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />

  <g opacity="0.25">
    <circle cx="180" cy="60" r="18" fill="#8b5cf6">
      <animate attributeName="cx" values="180;220;180" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="240" r="12" fill="#22d3ee">
      <animate attributeName="cx" values="980;1020;980" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;200;240" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="50" r="10" fill="#fb7185">
      <animate attributeName="cx" values="640;680;640" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;30;50" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="260" r="9" fill="#38bdf8">
      <animate attributeName="cx" values="520;560;520" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;240;260" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <g opacity="0.15" filter="url(#glow)">
    <rect x="140" y="210" width="70" height="70" fill="#7c3aed" rx="20">
      <animate attributeName="x" values="140;160;140" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y" values="210;190;210" dur="8s" repeatCount="indefinite" />
    </rect>
    <rect x="860" y="120" width="50" height="50" fill="#38bdf8" rx="14">
      <animate attributeName="x" values="860;880;860" dur="7s" repeatCount="indefinite" />
      <animate attributeName="y" values="120;140;120" dur="9s" repeatCount="indefinite" />
    </rect>
  </g>

  <path d="M70 260C210 220 360 180 520 140C680 100 820 92 930 130C1060 180 1140 240 1180 300" fill="none" stroke="#7c3aed" stroke-width="4" opacity="0.55">
    <animate attributeName="stroke-opacity" values="0.3;0.55;0.3" dur="10s" repeatCount="indefinite" />
  </path>

  <text x="50%" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#c9d1d9">Hi, I'm Gideon.</text>
  <text x="50%" y="165" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="42" font-weight="700" fill="#ffffff">Building at the intersection of math and tech.</text>
  <text x="50%" y="210" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#8b949e" text-transform="uppercase">DATA &amp; CLOUD • ACTUARIAL SCIENCE @ UCC • ACCRA • LEVEL 400</text>

  <g clip-path="url(#revealCaret)">
    <rect x="890" y="174" width="8" height="40" fill="#c4b5fd">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" begin="3s" />
    </rect>
  </g>
</svg>
