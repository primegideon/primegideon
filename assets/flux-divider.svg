  </defs>
  <rect width="100%" height="100%" fill="url(#base)" opacity="0.4" />
  <rect x="-300" y="0" width="300" height="4" fill="url(#beam)">
    <animate attributeName="x" values="-300;850" dur="2s" repeatCount="indefinite" />
