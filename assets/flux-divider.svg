    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E34F4F" stop-opacity="0" />
      <stop offset="50%" stop-color="#F4A236" stop-opacity="1" />
      <stop offset="100%" stop-color="#E34F4F" stop-opacity="0" />
