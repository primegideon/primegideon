<svg xmlns="http://www.w3.org/2000/svg" width="850" height="4">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="20%" stop-color="#E34F4F" />
      <stop offset="50%" stop-color="#E34F4F" />
      <stop offset="80%" stop-color="#E34F4F" />
